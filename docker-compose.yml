# ═══════════════════════════════════════════════════════════
#  Doni-Doni — Pile applicative
# ═══════════════════════════════════════════════════════════
# Les identifiants proviennent d'un fichier .env non versionné
# (voir .env.example). Aucun secret n'est écrit en dur ici.
#
# Exposition réseau : seuls l'API, Keycloak et l'objet MinIO sont
# publiés sur l'interface publique. Les bases, Redis et la console
# MinIO sont liés à 127.0.0.1 et ne sont joignables qu'en tunnel SSH :
#   ssh -L 5433:127.0.0.1:5433 root@<serveur>

services:

  postgres-keycloak:
    image: postgres:17-alpine
    container_name: doni-doni-postgres-keycloak
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER:?KEYCLOAK_DB_USER manquant}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD manquant}
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-app:
    image: postgres:17-alpine
    container_name: doni-doni-postgres-app
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-donidoni}
      POSTGRES_USER: ${APP_DB_USER:?APP_DB_USER manquant}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD manquant}
    volumes:
      - postgres-app-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: doni-doni-keycloak
    # Mode production : `start-dev` désactive les contrôles de configuration
    # et n'est pas supporté hors développement.
    command: start --features=token-exchange
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?KEYCLOAK_DB_USER manquant}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?KEYCLOAK_DB_PASSWORD manquant}
      # TLS assuré par le reverse proxy en amont ; Keycloak lit les en-têtes
      # X-Forwarded-* pour reconstruire les URL d'émission des jetons.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?KEYCLOAK_ADMIN_USER manquant}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD manquant}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    # Pas de healthcheck : l'image Keycloak n'embarque ni curl ni wget.
    # L'API tolère l'attente, elle redémarre tant que Keycloak n'est pas prêt.

  redis:
    image: redis:7-alpine
    container_name: doni-doni-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD manquant}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    image: minio/minio:latest
    container_name: doni-doni-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER manquant}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD manquant}
    ports:
      # 9000 sert les fichiers aux clients ; la console d'administration
      # reste privée.
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  doni-doni-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: doni-doni-api:${APP_VERSION:-latest}
    container_name: doni-doni-api
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-doni-doni}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-doni-doni-backend}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET manquant}

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD manquant}

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-app:5432/${APP_DB_NAME:-donidoni}
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USER:?APP_DB_USER manquant}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD manquant}

      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

      # Requis par le profil prod : sans elles l'application refuse de démarrer.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
    ports:
      - "${API_PORT:-8081}:8081"
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_started
      redis:
        condition: service_healthy
      postgres-app:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      # Utilisé par le pipeline de déploiement pour valider la mise en ligne.
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  postgres-keycloak-data:
  postgres-app-data:
  minio-data:
