name: CD Pipeline

on:
  push:
    branches: [ main ]
  # Redéploiement à la demande, sans avoir à pousser du code :
  # onglet Actions > CD Pipeline > « Run workflow ».
  workflow_dispatch:

# Deux poussées rapprochées ne doivent pas déployer en parallèle sur le
# même serveur ; la plus récente attend que la précédente se termine.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ── 1. Barrière de qualité ────────────────────────────────────────────
  # Rien n'est déployé si la branche ne compile pas.
  build:
    name: Compilation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer le JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compiler et tester
        run: ./mvnw --batch-mode --no-transfer-progress verify

  # ── 2. Mise en ligne ──────────────────────────────────────────────────
  deploy:
    name: Déploiement
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Vérifier les secrets requis
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          manquants=""
          for nom in SERVER_HOST SERVER_USER SERVER_SSH_KEY HEALTHCHECK_URL; do
            eval "valeur=\${$nom}"
            [ -n "$valeur" ] || manquants="$manquants $nom"
          done
          if [ -n "$manquants" ]; then
            echo "Secrets absents du dépôt :$manquants"
            echo "À créer dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Les quatre secrets sont présents."

      - name: Déployer sur le serveur
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          # Le bloc ci-dessous est volontairement minimal : appleboy/ssh-action
          # le transmet au shell distant via `bash -c`, et ce transport altère
          # les constructions multilignes élaborées. Toute la logique de
          # déploiement vit dans scripts/deploiement.sh, que bash lit comme un
          # fichier local — donc à l'abri de cette déformation.
          script: |
            set -eu
            cd /opt/doni-doni-backend
            REVISION=$(git rev-parse HEAD)
            git fetch --prune origin main
            git reset --hard origin/main
            bash scripts/deploiement.sh "$REVISION"

      - name: Vérifier la réponse publique
        env:
          URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          for tentative in $(seq 1 12); do
            if curl -fsS --max-time 10 "$URL" | grep -q '"status":"UP"'; then
              echo "Point de santé public accessible."
              exit 0
            fi
            sleep 10
          done

          # L'URL est un secret, donc masquée dans ce journal. Ces indices
          # dérivés suffisent à identifier une erreur de saisie sans jamais
          # révéler la valeur : confusion https/http, port oublié, espace
          # parasite en fin de chaîne.
          echo "Le point de santé public ne répond pas."
          echo "Diagnostic de HEALTHCHECK_URL (valeur masquée) :"
          echo "  longueur    : ${#URL} caractères"
          echo "  protocole   : ${URL%%:*}"
          echo "  port        : $(printf '%s' "$URL" | sed -n 's|.*://[^/:]*:\([0-9]*\).*|\1|p')"
          echo "  chemin      : /$(printf '%s' "$URL" | cut -d/ -f4-)"
          echo "  réponse curl :"
          curl -sS --max-time 10 -o /dev/null -w "    code HTTP %{http_code} en %{time_total}s\n" "$URL" || true
          exit 1
