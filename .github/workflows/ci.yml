name: CI

# Vérifie que la branche compile avant toute mise en ligne.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Compilation et tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer le JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compiler et tester
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Vérifier la construction de l'image Docker
        run: docker build --tag doni-doni-api:ci .

      - name: Valider docker-compose
        run: |
          cp .env.example .env
          docker compose config --quiet
